<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Vibrant Modern 'A' Gradient -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Crossbar Glow Gradient -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Minimalist 'A' Geometry -->
  <g filter="url(#glow)">
    <!-- Main Apex & Legs of 'A' -->
    <path d="M 256 100 L 366 380 H 300 L 256 260 L 212 380 H 146 Z" fill="url(#aGrad)"/>

    <!-- Inner Triangle Cutout -->
    <path d="M 256 168 L 282 238 H 230 Z" fill="#0d1320"/>

    <!-- Floating Minimal Crossbar -->
    <rect x="186" y="260" width="140" height="36" rx="12" fill="url(#crossbarGrad)"/>
  </g>
</svg>
